name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build shell
        run: npm run build:shell

      - name: Verify cloud contract types are up to date
        run: node scripts/generate-cloud-contracts.mjs --check

      # Phase 3: the sibling contract source is the unique spec; fail on any
      # mirror drift against it.
      - name: Check out bittune-cloud contract source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bitcloud-ai/bittune-cloud
          path: bittune-cloud
      - name: Verify cloud contract mirror sync
        run: npm run check:cloud-contract
        env:
          BITTUNE_CLOUD_SOURCE_DIR: ${{ github.workspace }}/bittune-cloud/openapi

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c8961b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Python Core
        run: python -m pip install ./packages/bittune-core
      - name: Run Python Core tests
        run: npm run test:python

      - name: Verify managed parameter descriptors match Core
        run: npm run check:managed-contract

      - name: Test
        run: npm test

      - name: Verify release boundary
        run: npm run check:release-boundary
